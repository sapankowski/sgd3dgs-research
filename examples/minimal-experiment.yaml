  code_license: Apache-2.0 root; nested dependencies require audit
  weights: prepared upstream checkpoint
  weights_license: verify before the real run
environment:
  operating_system: Ubuntu 22.04
  gpu: NVIDIA GPU with at least 24 GB VRAM
  container_or_lock: environments/saga-v2/lock-to-be-recorded
command: python saga_gui.py --model_path /shared/scenes/public-room/model
metrics:
  planned:
    - runtime
    - peak VRAM
    - selected Gaussian count
artifacts:
  output_directory: artifacts/
stopping_condition: Stop after six hours or two failures at the documented smoke test.
notes:
  - Metadata-only fixture; paths and checksums are not real assets.
