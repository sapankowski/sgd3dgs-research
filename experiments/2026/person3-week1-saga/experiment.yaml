  commit: "2d4c5d77c857c956d747e4775d3d72c4ec5dfe16"
  code_license: Apache-2.0 for SAGA; upstream Gaussian rasterizer components retain their research licenses.
  weights: https://dl.fbaipublicfiles.com/segment_anything/sam_vit_b_01ec64.pth
  weights_license: Apache-2.0
environment:
  operating_system: Windows 11 x64, build 26200
  gpu: NVIDIA GeForce RTX 5070 Ti Laptop GPU, 12227 MiB
  container_or_lock: environment.txt
command: See the commands and click coordinates in RESULTS.md.
metrics:
  planned:
    - Runtime and peak allocated CUDA memory when measurable
