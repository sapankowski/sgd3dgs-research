decision: Assess whether the pinned SAGA baseline can produce a point-order-aligned object mask on the contributor's Windows GPU.
hypothesis: Multi-click SAGA will retain the truck cab, wheels and cargo bed across three held-out views with limited visible pavement leakage.
scene:
