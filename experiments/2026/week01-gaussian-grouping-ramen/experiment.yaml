schema_version: 1
experiment_id: week01-gaussian-grouping-ramen
title: Export and inspect the ramen bowl Gaussian mask
owner: person-5
reviewer: sapankowski
status: completed
time_budget_hours: 6
decision: >-
  Keep the official checkpoint as a reproducible fallback for native labels
  and defer the team baseline decision until a matched comparison exists.
hypothesis: >-
  A single native identity from the published checkpoint can cover
  the yellow bowl consistently in all three annotated views.
scene:
  id: lerf-mask-ramen
  manifest: experiments/2026/week01-gaussian-grouping-ramen/README.md#inputs
  source_sha256: d2fee173a0ec2e98e72fa45483f816ccbec86ab66825d00dc8213220a2a5866a
method:
  name: Gaussian Grouping
  repository: https://github.com/lkeab/gaussian-grouping
  commit: 0ab60afed3385b717c985af1d30a20f7b0884c89
  code_license: Apache-2.0 at root, with separate terms for nested components
  weights: https://huggingface.co/mqye/Gaussian-Grouping/blob/34cbf65561144792d7a1861b38274bd7be18c8bc/checkpoint/lerf_mask/ramen.zip
  weights_license: Apache-2.0 declared by the checkpoint host repository
environment:
  operating_system: Ubuntu 24.04 on WSL2 for export and Windows for rendering
  gpu: CPU-only export, NVIDIA GeForce RTX 5060 Laptop GPU for rendering
  container_or_lock: Python 3.12.3, PyTorch 2.6.0+cpu, NumPy 2.5.5, plyfile 1.1.5, SplatTransform 3.12.0
command: >-
  OMP_NUM_THREADS=4 MKL_NUM_THREADS=4 python scripts/gaussian_grouping/export_labels.py
  --ply "$CHECKPOINT/point_cloud.ply" --classifier "$CHECKPOINT/classifier.pth"
  --select-id 108 --threshold 0.3 --output "$RESULT"
metrics:
  planned:
    - CPU export time
    - selected Gaussian count, bounds and voxel components
    - mask overlap in three annotated views
    - peak GPU allocation during visualization
artifacts:
  output_directory: artifacts/ramen-yellow-bowl-001/
stopping_condition: >-
  Stop after exporting one bowl mask and measuring three annotated views,
  or when the setup time box expires and the blocker can be documented.
notes:
  - The experiment record describes a completed local run. PR approval is pending.
  - The manifest points to the research input record for the official example.
  - See README.md for the rendering commands and metrics.json for measured results.
